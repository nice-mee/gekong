6 25.5s step-end infinite both}@keyframes l7{0%,26.275%{opacity:0}26.314%,100%{opacity:1}}.l7{animation:l7 25.5s linear infinite both}@keyframes c7{0%{transform:translateX(0)}27.059%{transform:translateX(0);animation-timing-function:steps(74,end)}34.510%,100%{transform:translateX(599.4px)}}.c7{animation:c7 25.5s linear infinite both}@keyframes k7{0%,26.275%{opacity:0}26.275%,36.863%{opacity:1}36.863%,100%{opacity:0}}.k7{animation:k7 25.5s step-end infinite both}@keyframes l8{0%,36.863%{opacity:0}37.843%,100%{opacity:1}}.l8{animation:l8 25.5s linear infinite both}@keyframes l9{0%,38.824%{opacity:0}39.804%,100%{opacity:1}}.l9{animation:l9 25.5s linear infinite both}@keyframes p9{0%,39.216%{opacity:0}40.392%,100%{opacity:1}}.p9{animation:p9 25.5s linear infinite both}@keyframes l10{0%,41.961%{opacity:0}42.941%,100%{opacity:1}}.l10{animation:l10 25.5s linear infinite both}@keyframes p10{0%,42.745%{opacity:0}43.922%,100%{opacity:1}}.p10{animation:p10 25.5s linear infinite both}@keyframes l11{0%,43.922%{opacity:0}44.902%,100%{opacity:1}}.l11{animation:l11 25.5s linear infinite both}@keyframes l12{0%,47.451%{opacity:0}48.431%,100%{opacity:1}}.l12{animation:l12 25.5s linear infinite both}@keyframes p12{0%,51.373%{opacity:0}52.549%,100%{opacity:1}}.p12{animation:p12 25.5s linear infinite both}@keyframes l13{0%,49.020%{opacity:0}50.000%,100%{opacity:1}}.l13{animation:l13 25.5s linear infinite both}@keyframes l14{0%,49.804%{opacity:0}50.784%,100%{opacity:1}}.l14{animation:l14 25.5s linear infinite both}@keyframes l15{0%,55.686%{opacity:0}56.667%,100%{opacity:1}}.l15{animation:l15 25.5s linear infinite both}@keyframes l16{0%,57.647%{opacity:0}58.627%,100%{opacity:1}}.l16{animation:l16 25.5s linear infinite both}@keyframes l17{0%,61.176%{opacity:0}62.157%,100%{opacity:1}}.l17{animation:l17 25.5s linear infinite both}@keyframes p17{0%,62.745%{opacity:0}63.922%,100%{opacity:1}}.p17{animation:p17 25.5s linear infinite both}@keyframes l18{0%,69.020%{opacity:0}70.000%,100%{opacity:1}